name: Schema, Generator and Snapshot Validation

on:
  push:
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'data/core-v0.1/**'
      - 'generators/**'
      - 'tools/**'
      - 'requirements-dev.txt'
      - '.github/workflows/schema-validation.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'data/core-v0.1/**'
      - 'generators/**'
      - 'tools/**'
      - 'requirements-dev.txt'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python tools/validate_schemas.py
      - run: python tools/test_core_generator.py
      - run: python tools/test_core_snapshot.py
      - run: python tools/build_snapshot.py --output build/core-v0.1
      - uses: actions/upload-artifact@v4
        with:
          name: referencecity-core-v0.1
          path: build/core-v0.1
          if-no-files-found: error
