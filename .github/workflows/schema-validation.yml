name: ReferenceCity Validation
on:
  push:
    paths: ['schemas/**','examples/**','data/**','scenarios/**','expected/**','adapter/**','generators/**','tools/**','requirements-dev.txt','.github/workflows/schema-validation.yml']
  pull_request:
    paths: ['schemas/**','examples/**','data/**','scenarios/**','expected/**','adapter/**','generators/**','tools/**','requirements-dev.txt']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: python tools/validate_schemas.py
      - run: python tools/test_core_generator.py
      - run: python tools/test_core_snapshot.py
      - run: python tools/check_release_lock.py
      - run: python tools/test_governance.py
      - run: python tools/test_transaction_rules.py
      - run: python tools/test_document_hash.py
      - run: python tools/test_scenarios.py
      - run: python tools/test_adapter_contract.py
      - run: python tools/build_snapshot.py --output build/core-v0.1
      - run: python tools/build_benchmark_input.py --output build/benchmark-input-v0.1
      - uses: actions/upload-artifact@v4
        with: {name: referencecity-core-v0.1, path: build/core-v0.1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: referencecity-benchmark-input-v0.1, path: build/benchmark-input-v0.1, if-no-files-found: error}
